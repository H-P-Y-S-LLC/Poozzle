<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1220" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MatchFace" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>MatchFace</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot-splash">
      <img src="./icon-192.png" alt="" width="104" height="104" />
      <div class="boot-title">MatchFace</div>
      <div class="boot-bar"><span></span></div>
    </div>
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #0f1220;
        color: #f2f5ff;
        font-family: "Open Sans", "PingFang SC", system-ui, sans-serif;
        transition: opacity 0.35s ease;
      }
      #boot-splash img {
        width: 104px;
        height: 104px;
        border-radius: 24px;
        box-shadow: 0 12px 34px rgba(0, 0, 0, 0.55);
        animation: boot-float 2.4s ease-in-out infinite;
      }
      #boot-splash .boot-title {
        font-size: 28px;
        letter-spacing: 0.14em;
        font-family: ui-monospace, Consolas, monospace;
      }
      #boot-splash .boot-bar {
        width: 148px;
        height: 8px;
        border: 2px solid #333a52;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.04);
      }
      #boot-splash .boot-bar span {
        display: block;
        width: 40%;
        height: 100%;
        background: #4c9aff;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      #boot-splash.hide {
        opacity: 0;
        pointer-events: none;
      }
      @keyframes boot-slide {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(320%); }
      }
      @keyframes boot-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
    </style>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
